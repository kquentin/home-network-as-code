name: update flake.lock

on:
  schedule:
    - cron: "0 0 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "experimental-features = nix-command flakes"

      - name: Update nixpkgs and commit if it moved
        shell: bash
        run: |
          set -euo pipefail

          # nixpkgs only: disko should not move without a decision.
          nix flake update nixpkgs

          if [[ -z "$(git status --porcelain -- flake.lock)" ]]; then
            printf 'nixpkgs unchanged, nothing to push\n'
            exit 0
          fi

          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git commit --message 'flake.lock: weekly nixpkgs update (nixos-26.05)' -- flake.lock

          # Walks every module and assertion without building.
          for host in homeserver netboot; do
            nix eval ".#nixosConfigurations.$host.config.system.build.toplevel.drvPath"
          done

          git push
